# Runs the whole stack:  docker compose up --build
#   api -> http://localhost:3000   (Node.js / Express)
#   db  -> localhost:5434          (PostgreSQL; 5434 so it never clashes with another Postgres on 5432)
# For local development without the api container:  docker compose up -d db  &&  npm run dev
services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5434:5432"
    volumes:
      - taskflow-data:/var/lib/postgresql/data
      # Files in this folder run automatically on the very first start.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: taskflow-api
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside Docker the database is reached by its service name "db" on port 5432.
      DATABASE_URL: postgres://taskflow:taskflow@db:5432/taskflow
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      JWT_EXPIRES_IN: 1d
    ports:
      # Change the host side if 3000 is busy, e.g.  API_PORT=3002 docker compose up
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskflow-data:
